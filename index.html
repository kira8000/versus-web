<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Versus Web</title>
<style>
  :root { --bg:#1e1e1e; --win:#5fbf5f; --lose:#d9534f; --open:#777; --glow:#ffd75e; --row:60px; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
         background:var(--bg); color:#ddd; font:18px/1.2 ui-monospace,"Cascadia Mono",Consolas,monospace; }
  /* palco: a Home fica no fundo; as janelas (chave, histórico, ranking) sobrepõem com respiro */
  #stage { flex:1; min-height:0; position:relative; overflow:hidden; }
  #home { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
          gap:28px; padding:24px; text-align:center; }
  h1 { margin:0 -.3em 0 0; font-size:clamp(48px, 15vw, 88px); letter-spacing:.3em; color:var(--win); text-shadow:0 0 18px #5fbf5f66; }
  .cta { min-height:60px; min-width:230px; padding:0 32px; font:inherit; font-size:20px; font-weight:bold; letter-spacing:3px;
         background:var(--win); color:#111; border:0; border-radius:30px; box-shadow:0 0 22px #5fbf5f55; cursor:pointer; }
  #home small { color:#999; font-size:14px; }
  #win { --gap:clamp(10px, 3vw, 24px); position:absolute; inset:var(--gap); top:calc(var(--gap) + env(safe-area-inset-top));
         display:flex; flex-direction:column; background:#232323; border:1px solid #3c3c3c; border-radius:14px; overflow:hidden;
         box-shadow:0 0 0 100vmax #000b, 0 14px 36px #000; animation:pop .14s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(10px) scale(.98); } }
  .wh { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 4px 4px 16px; border-bottom:1px solid #333; }
  .wh b { color:var(--glow); font-size:14px; letter-spacing:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .wh button { flex:none; width:44px; height:44px; background:none; border:0; color:#aaa; font:inherit; font-size:20px; cursor:pointer; }
  #tools { display:flex; gap:8px; justify-content:center; align-items:center; padding:10px 14px 0; min-height:54px; }
  #tools button { min-height:44px; padding:0 16px; font:inherit; font-size:15px; font-weight:bold; background:#2c2c2c;
                  color:#eee; border:1px solid #444; border-radius:22px; }
  #tools button.primary { background:var(--win); color:#111; border-color:var(--win); }
  #tools button:disabled { opacity:.35; }
  #tools small { color:#999; font-size:13px; }
  #page { flex:1; overflow-y:auto; padding:14px; }
  .card { display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; min-height:60px; padding:10px 14px;
          margin-bottom:10px; background:#262626; border:1px solid #333; border-radius:8px; font:inherit; color:#ddd; text-align:left; }
  button.card { cursor:pointer; }
  .card i { font-style:normal; color:#999; margin-left:auto; padding-left:8px; }
  .card b { margin-left:auto; }
  .hcard { margin-bottom:10px; border:1px solid #333; border-radius:8px; background:#262626; overflow:hidden; }
  .hcard .card { margin:0; border:0; border-radius:0; }
  .hcard.open .card { border-bottom:1px solid #333; }
  .mini { overflow-x:auto; padding:4px 0 8px; scrollbar-color:#888 #2a2a2a; }
  .mini .slot { font-size:14px; padding-bottom:3px; gap:6px; }
  .mini .dots { font-size:11px; }
  .mini .champ { font-size:15px; }
  .card small { color:#999; font-size:13px; }
  .card b { color:var(--glow); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  table { width:100%; border-collapse:collapse; font-size:16px; }
  th, td { padding:12px 6px; text-align:right; }
  th { color:#999; font-size:13px; font-weight:normal; }
  th:nth-child(2), td:nth-child(2) { text-align:left; width:100%; max-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  tbody tr { border-top:1px solid #333; }
  tr.top td { color:var(--glow); font-weight:bold; }
  .empty, .legend { color:#999; text-align:center; font-size:14px; }
  .empty { margin-top:48px; }
  [hidden] { display:none !important; }
  /* uma fase por tela; a barra de rolagem fica colada acima dos botões e precisa ser bem visível */
  /* janela CHAVE: chave em cima (com undo/redo flutuante), character select embaixo */
  #arena { flex:1; min-height:0; position:relative; display:flex; }
  .fab { position:absolute; top:10px; right:16px; z-index:2; display:flex; gap:8px; }
  .fab button { width:48px; height:48px; border-radius:50%; font:inherit; font-size:22px; color:#eee; background:#2c2c2cee;
                border:1px solid #555; box-shadow:0 4px 12px #0008; cursor:pointer; }
  .fab button:disabled { opacity:.3; cursor:default; }
  #select { flex:0 0 44%; min-height:0; display:flex; flex-direction:column; gap:10px; padding:10px 12px 12px;
            border-top:1px solid #333; background:#1f1f1f; }
  #add { display:flex; gap:8px; }
  #add input { flex:1; min-width:0; min-height:48px; padding:0 14px; font:inherit; font-size:16px; color:#eee; background:#2a2a2a;
               border:1px solid #444; border-radius:10px; outline:none; }
  #add input:focus { border-color:var(--glow); }
  #add button { min-height:48px; padding:0 16px; font:inherit; font-size:15px; font-weight:bold; background:var(--win); color:#111;
                border:0; border-radius:10px; cursor:pointer; }
  #grid { flex:1; min-height:0; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:8px; align-content:start; }
  #grid .empty { grid-column:1 / -1; margin-top:12px; }
  .mc { min-height:52px; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:6px 10px; font:inherit;
        font-size:15px; font-weight:bold; color:#eee; background:#2c2c2c; border:1px solid #484848; border-radius:10px; text-align:left; cursor:pointer; }
  .mc span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mc small { color:var(--glow); font-size:11px; font-weight:normal; }
  .mc.used { opacity:.4; }
  .mc:active { border-color:var(--glow); }
  #scroll { flex:1; min-width:0; overflow:auto; scroll-snap-type:x mandatory; scrollbar-color:#888 #2a2a2a; }
  #scroll::-webkit-scrollbar { height:12px; width:6px; }
  #scroll::-webkit-scrollbar-track { background:#2a2a2a; }
  #scroll::-webkit-scrollbar-thumb { background:#888; border-radius:6px; }
  .bk { position:relative; }
  .bk svg { position:absolute; inset:0; overflow:visible; }
  .snap { position:absolute; top:0; height:1px; scroll-snap-align:start; }
  .slot, .area { position:absolute; height:44px; }
  .slot { display:flex; align-items:flex-end; gap:8px; padding:0 2px 6px; background:none; border:0; color:var(--open);
          font:inherit; font-weight:bold; text-align:left; white-space:nowrap; user-select:none;
          -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
  .nm { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  button.slot:not(:disabled) { cursor:pointer; }
  /* vaga iluminada: o próximo MC tocado na grade cai aqui */
  .slot.pick { cursor:pointer; }
  .slot.target { background:linear-gradient(transparent 55%, #ffd75e2a); box-shadow:inset 0 -4px 0 var(--glow); animation:pulse 1.1s ease-in-out infinite; }
  .land { transform-origin:left bottom; animation:land .45s ease-out; }
  @keyframes land { from { transform:scale(1.3); color:var(--glow); text-shadow:0 0 16px var(--glow); } }
  .bump { display:inline-block; font-weight:inherit; animation:bump .45s ease-out; }
  @keyframes bump { 40% { transform:scale(1.9); color:var(--glow); } }
  .slot.win { color:var(--win); } .slot.lose { color:var(--lose); } .slot.dim { opacity:.45; }
  .dots { flex:none; letter-spacing:2px; font-size:14px; }
  .slot.suggested, .area.suggested { animation:pulse 1.1s ease-in-out infinite; }
  .slot.suggested { color:var(--glow); text-shadow:0 0 8px var(--glow); }
  @keyframes pulse { 50% { filter:brightness(1.6); } }
  .holding::after { content:""; position:absolute; left:0; right:0; bottom:0; height:4px; background:var(--glow);
                    transform-origin:left; animation:fill 1.2s linear forwards; }
  @keyframes fill { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  .flash { animation:flash .5s; } @keyframes flash { 0% { background:#fff4; } }
  .champ { color:var(--glow); font-size:18px; text-shadow:0 0 10px var(--glow); }
  /* barra inferior persistente: botão de janela abre/fecha (toggle); CHAVE no meio, maior */
  nav { display:flex; gap:6px; align-items:center; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:#161616; border-top:1px solid #2a2a2a; }
  nav button { flex:1; min-width:0; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
               padding:0 2px; font:inherit; font-size:10px; font-weight:bold; background:none; color:#aaa; border:1px solid #333; border-radius:10px; cursor:pointer; }
  nav button i { font-style:normal; font-size:18px; line-height:1; }
  nav button.main { flex:1.4; min-height:60px; font-size:12px; letter-spacing:2px; background:#2c2c2c; color:#eee; border-color:#555; }
  nav button.active { color:var(--glow); border-color:var(--glow); }
  nav button.main.active { background:var(--win); color:#111; border-color:var(--win); box-shadow:0 0 14px #5fbf5f66; }
  nav button:disabled { opacity:.35; cursor:default; }
  /* movimento reduzido: sem pulso nem pouso; a barra de segurar fica (é informação) */
  @media (prefers-reduced-motion: reduce) { #win, .suggested, .target, .land, .bump, .flash { animation:none !important; } }
</style>
</head>
<body>
<div id="stage">
  <section id="home"></section>
  <div id="win" role="dialog" hidden>
    <div class="wh"><b id="wtitle"></b><button data-close aria-label="Fechar">✕</button></div>
    <div id="tools"></div>
    <div id="arena">
      <div id="scroll"><div id="board"></div></div>
      <div class="fab"><button data-act="undo" aria-label="Desfazer">↶</button><button data-act="redo" aria-label="Refazer">↷</button></div>
    </div>
    <section id="select" hidden>
      <form id="add"><input id="addName" placeholder="Novo MC" aria-label="Nome do novo MC" autocomplete="off" enterkeyhint="done"><button>Adicionar</button></form>
      <div id="grid"></div>
    </section>
    <main id="page" hidden></main>
  </div>
</div>
<nav id="bar"></nav>
<script>
const KEY = 'versus-web:v2', KEY_V1 = 'versus-web:v1', HOLD_MS = 1200, PAD = 28, LIVE_PAD = 76, MIN_ROW = 60;
let ROW = 60, COL = 300; // recalculados no render: 1 coluna = largura da tela, 1ª fase = altura útil

// ---------- lógica pura ----------
// Chave v2 = linha do tempo: events (place | round | draw) + cursor. Undo/redo só move o cursor.
function fresh(size = 4) {
  return { id: String(Date.now()), createdAt: Date.now(), size, events: [], cursor: 0 };
}

// Replay dos eventos até o cursor → formato que derive() entende ({ names, overrides, taps }). Entrada v1 passa direto.
function view(s) {
  if (!s.events) return s;
  const names = Array(s.size).fill(''), overrides = {}, taps = [];
  for (const e of s.events.slice(0, s.cursor)) {
    if (e.t === 'place') { if (e.slot.startsWith('0-')) names[+e.slot.slice(2)] = e.name; else overrides[e.slot] = e.name; }
    else taps.push({ match: e.match, winner: e.t === 'round' ? e.winner : null });
  }
  return { size: s.size, names, overrides, taps };
}
// Ação nova descarta o que estava no redo (comportamento de editor).
function push(s, ev) { s.events = s.events.slice(0, s.cursor); s.events.push(ev); s.cursor = s.events.length; return s; }
function undo(s) { if (s.cursor > 0) s.cursor--; return s; }
function redo(s) { if (s.cursor < s.events.length) s.cursor++; return s; }

// Slot iluminado: a vaga vazia escolhida (pick) ou a 1ª vaga vazia da 1ª fase. Fases seguintes só por toque (repescagem).
function target(s, pick = null) {
  const { cols } = derive(view(s)), L = cols.length - 1;
  if (pick) { const [c, i] = pick.split('-').map(Number); if (c < L && cols[c][i] && !cols[c][i].name) return pick; }
  const i = cols[0].findIndex(x => !x.name);
  return i < 0 ? null : `0-${i}`;
}

// v1 → v2: names viram place na 1ª fase, taps viram round/draw, overrides viram place nas fases seguintes.
function toV2(x) {
  if (!x || !x.names) return x; // entrada antiga do histórico: só o campeão
  const { names, overrides = {}, taps = [], started, ...rest } = x, events = [];
  names.forEach((n, i) => { if (n && n.trim()) events.push({ t: 'place', slot: `0-${i}`, name: n }); });
  taps.forEach(t => events.push(t.winner === null ? { t: 'draw', match: t.match } : { t: 'round', match: t.match, winner: t.winner }));
  Object.entries(overrides).forEach(([slot, name]) => { if (name && name.trim()) events.push({ t: 'place', slot, name }); });
  return { ...rest, events, cursor: events.length };
}
const migrate = v1 => ({ current: toV2(v1.current), history: (v1.history || []).map(toV2) });

// Tudo (placar, avanço, confronto sugerido, campeão) sai de names + overrides + taps.
function derive({ size, names, overrides, taps }) {
  const L = Math.log2(size), cols = [names.map((n, i) => ({ id: `0-${i}`, name: (n || '').trim(), dots: 0, state: 'open' }))];
  let suggested = null, champion = null;
  const playable = new Set();
  for (let c = 0; c < L; c++) {
    const next = [];
    for (let m = 0; m < cols[c].length / 2; m++) {
      const a = cols[c][2 * m], b = cols[c][2 * m + 1], id = `${c}-${m}`;
      const t = taps.filter(x => x.match === id);
      a.dots = t.filter(x => x.winner === a.id).length;
      b.dots = t.filter(x => x.winner === b.id).length;
      const w = a.dots >= 2 ? a : b.dots >= 2 ? b : null;
      if (w) { w.state = 'win'; (w === a ? b : a).state = 'lose'; }
      a.match = b.match = id;
      a.editable = b.editable = t.length === 0;
      if (!w && a.name && b.name) { playable.add(id); suggested ??= id; }
      if (w && c === L - 1) champion = w.name;
      const nid = `${c + 1}-${m}`;
      next.push({ id: nid, name: ((overrides[nid] || '').trim()) || (w ? w.name : ''), dots: 0, state: 'open' });
    }
    cols.push(next);
  }
  return { cols, suggested, champion, playable };
}

// Mesma regra do service-versus (organization-ranking.service.ts): vitória +3, vitória 2x0 +1, título +5.
// Desempate: pontos → títulos → 2x0 → vitórias. Nome comparado sem caixa/espaços.
function rank(history) {
  const m = new Map(), row = n => {
    const k = n.trim().toLowerCase();
    if (!m.has(k)) m.set(k, { name: n.trim(), points: 0, wins: 0, w20: 0, titles: 0 });
    return m.get(k);
  };
  for (const h of history) {
    const d = h.names || h.events ? derive(view(h)) : null, champ = d ? d.champion : h.champion; // entrada antiga: só o título
    if (d) d.cols.slice(0, -1).forEach(col => col.forEach((s, i) => {
      if (s.state !== 'win') return;
      const r = row(s.name); r.wins++; r.points += 3;
      if (col[i ^ 1].dots === 0) { r.w20++; r.points++; }
    }));
    if (champ) { const r = row(champ); r.titles++; r.points += 5; }
  }
  return [...m.values()].sort((a, b) => b.points - a.points || b.titles - a.titles || b.w20 - a.w20 || b.wins - a.wins);
}

// ---------- auto-teste ----------
(() => {
  const N = ['A', 'B', 'C', 'D'], t = (m, w) => ({ match: m, winner: w });
  const d = (taps, names = N, ov = {}) => derive({ size: 4, names, overrides: ov, taps });
  const AA = [t('0-0', '0-0'), t('0-0', '0-0')];
  console.assert(d(AA).cols[1][0].name === 'A', 'avança com 2 bolinhas');
  console.assert(d([t('0-0', null), t('0-0', null)]).cols[1][0].name === '' && d([t('0-0', null)]).cols[0][0].dots === 0, 'empate não pontua');
  console.assert(d([], ['A', '', 'C', 'D']).suggested === '0-1', 'slot vazio bloqueia confronto');
  const out = d([t('0-1', '0-3'), t('0-1', '0-3')]);
  console.assert(out.cols[1][1].name === 'D' && out.cols[1][0].name === '', 'fora de ordem');
  console.assert(d(AA, N, { '1-0': 'Z' }).cols[1][0].name === 'Z', 'override ganha');
  console.assert(d(AA.slice(0, -1)).cols[1][0].name === '', 'undo de avanço');
  const full = [...AA, t('0-1', '0-2'), t('0-1', '0-2'), t('1-0', '1-1'), t('1-0', '1-1')];
  console.assert(d(full).champion === 'C', 'campeão');
  // A vence B 2x0, C vence D 2x1, A vence C 2x0 → A: 3+1+3+1+5 = 13 (+5 do título antigo 'a ') ; C: 3
  const h = { size: 4, names: N, overrides: {}, taps: [...AA, t('0-1', '0-2'), t('0-1', '0-3'), t('0-1', '0-2'), t('1-0', '1-0'), t('1-0', '1-0')] };
  const rk = rank([h, { champion: 'a ', size: 4 }]);
  console.assert(rk[0].name === 'A' && rk[0].points === 18 && rk[0].titles === 2 && rk[1].name === 'C' && rk[1].points === 3, 'ranking');

  // linha do tempo v2
  const s = fresh(4), P = (name, pick) => push(s, { t: 'place', slot: target(s, pick), name }), R = (m, w) => push(s, { t: 'round', match: m, winner: w });
  P('A');
  console.assert(view(s).names[0] === 'A' && target(s) === '0-1', 'place vai para o slot iluminado');
  console.assert(target(s, '0-3') === '0-3' && target(s, '0-0') === '0-1', 'tocar vaga vazia move o destaque');
  P('D', '0-3'); P('B'); P('C');
  console.assert(view(s).names.join('') === 'ABCD' && target(s) === null, 'montagem fora de ordem');
  R('0-0', '0-0'); R('0-0', '0-0');
  console.assert(derive(view(s)).cols[1][0].name === 'A', 'round pela timeline');
  undo(s);
  console.assert(derive(view(s)).cols[1][0].name === '' && derive(view(s)).cols[0][0].dots === 1, 'undo de round');
  undo(s); undo(s);
  console.assert(view(s).names[2] === '' && target(s) === '0-2', 'undo de place');
  redo(s); redo(s); redo(s);
  console.assert(derive(view(s)).cols[1][0].name === 'A' && s.cursor === s.events.length, 'redo');
  undo(s); push(s, { t: 'draw', match: '0-0' });
  console.assert(s.events.length === 6 && s.cursor === 6 && s.events[5].t === 'draw' && derive(view(s)).cols[0][0].dots === 1, 'ação nova limpa o redo');

  // migração v1 → v2: mesmo placar, campeão e ranking
  const sig = x => { const r = derive(view(x)); return JSON.stringify([r.cols.map(c => c.map(y => [y.name, y.dots, y.state])), r.champion]); };
  const v1 = { current: { id: '1', createdAt: 1, size: 4, started: true, names: N, overrides: { '1-1': 'Z' }, taps: [t('0-0', '0-0'), t('0-0', null), t('0-0', '0-0')] },
               history: [{ ...h, id: '0', createdAt: 0, started: true, champion: 'A' }, { createdAt: 0, champion: 'a ', size: 4 }] };
  const m = migrate(v1);
  console.assert(sig(m.current) === sig(v1.current) && sig(m.history[0]) === sig(v1.history[0]) && !('names' in m.current)
    && JSON.stringify(rank(m.history)) === JSON.stringify(rank(v1.history)) && m.history[1].champion === 'a ' && !m.history[1].events, 'migração v1 → v2');
})();

// ---------- estado + storage ----------
// v2 primeiro; sem v2, migra a v1. A v1 nunca é apagada nem sobrescrita: fica como backup.
const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
function load() { const v2 = read(KEY); if (v2 && v2.current) return v2; const v1 = read(KEY_V1); return v1 && v1.current ? migrate(v1) : null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { /* modo privado: segue sem salvar */ } }
const db = load() || { current: fresh(), history: [] };
if (!read(KEY) && read(KEY_V1)) save(); // acabou de migrar: grava a v2 (a v1 continua lá)
const cur = () => db.current;
// Estado de tela, nunca salvo:
// win = janela aberta sobre a Home (null | 'battle' | 'hist' | 'rank'); recarregar no meio da batalha volta direto para a chave.
// pick = vaga vazia escolhida com toque; fx = animação da última ação; openHist = cards do histórico expandidos.
let win = cur().events.length ? 'battle' : null, pick = null, fx = {};
const openHist = new Set();

// ---------- render ----------
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const key = n => n.trim().toLowerCase();

const fmtDate = ms => new Date(ms).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });

// Desenha a chave de `s`. live = palco (toques, vaga iluminada, laterais do colchete); senão só leitura (histórico).
function bracket(s, { col, row, slotH = 44, pad = PAD, live = false, tgt = null }) {
  const d = derive(view(s)), { cols, champion, playable } = d, L = cols.length - 1, suggested = live && !tgt ? d.suggested : null;
  const yOf = (c, i) => pad + (i + 0.5) * 2 ** c * row;
  const W = (L + 1) * col, H = s.size * row + pad;
  const color = st => st === 'win' ? 'var(--win)' : st === 'lose' ? 'var(--lose)' : 'var(--open)';
  const land = new Set(live && fx.land || []);
  let svg = '', areas = '', html = '';

  cols.forEach((cl, c) => cl.forEach((sl, i) => {
    const x = c * col + 16, y = yOf(c, i), last = c === L;
    const lineEnd = last ? x + col - 32 : x + col - 48;
    if (live && i === 0) html += `<div class="snap" style="left:${c * col}px;width:${col}px"></div>`;
    svg += `<line x1="${x}" y1="${y}" x2="${lineEnd}" y2="${y}" stroke="${color(sl.state)}"/>`;
    if (!last) {
      const ym = yOf(c + 1, i >> 1);
      svg += `<line x1="${lineEnd}" y1="${y}" x2="${lineEnd}" y2="${ym}" stroke="${color(sl.state)}"/>`;
      if (i % 2 === 0) {
        const decided = cl[i].state !== 'open';
        svg += `<line x1="${lineEnd}" y1="${ym}" x2="${x + col}" y2="${ym}" stroke="${decided ? 'var(--win)' : 'var(--open)'}"/>`;
        // laterais do colchete: metade de cima = round do MC de cima, de baixo = do MC de baixo; segurar = empate
        if (live && playable.has(sl.match)) {
          const yb = yOf(c, i + 1), sg = sl.match === suggested ? ' suggested' : '';
          const area = (top, bot, id) => `<div class="area${sg}" data-match="${sl.match}" data-slot="${id}" style="left:${lineEnd - 28}px;top:${top}px;width:56px;height:${bot - top}px"></div>`;
          areas += area(y - 36, ym, sl.id) + area(ym, yb + 24, cl[i + 1].id);
        }
      }
    }
    const style = `left:${x}px;top:${y - slotH}px;width:${lineEnd - x - 8}px;height:${slotH}px`;
    const fxc = land.has(sl.id) ? ' land' : '';
    if (last) { html += `<div class="slot${champion ? ' champ' : ''}${fxc}" style="${style}"><span class="nm">${esc(sl.name)}</span>${champion ? ' 👑' : ''}</div>`; return; }
    if (live && !sl.name) { // vaga vazia: tocar move o destaque para ela
      html += `<button class="slot pick${sl.id === tgt ? ' target' : ''}${fxc}" data-pick="${sl.id}" aria-label="Vaga ${sl.id}" style="${style}"></button>`;
      return;
    }
    const cls = [sl.state, sl.match === suggested && 'suggested', live && !tgt && sl.state === 'open' && sl.match !== suggested && 'dim', live && sl.match === fx.flash && 'flash'].filter(Boolean).join(' ');
    const can = live && playable.has(sl.match);
    const dots = live && fx.bump === sl.id && sl.dots ? '●'.repeat(sl.dots - 1) + '<b class="bump">●</b>' : '●'.repeat(sl.dots);
    html += `<button class="slot ${cls}${fxc}" data-slot="${sl.id}" data-match="${sl.match}" ${can ? '' : 'disabled'} style="${style}"><span class="nm">${esc(sl.name)}</span><span class="dots">${dots}</span></button>`;
  }));
  return `<div class="bk" style="width:${W}px;height:${H}px"><svg width="${W}" height="${H}" stroke-width="3">${svg}</svg>${areas}${html}</div>`;
}

// Cartas do character select: ranking (ordem de pontos), depois quem já apareceu no histórico ou na chave atual.
function roster() {
  const seen = new Map(), add = (n, pts) => { if (n && n.trim() && !seen.has(key(n))) seen.set(key(n), { name: n.trim(), pts }); };
  rank(db.history).forEach(r => add(r.name, r.points));
  [...db.history.filter(h => h.events || h.names), cur()].map(view)
    .forEach(v => [...v.names, ...Object.values(v.overrides)].forEach(n => add(n, 0)));
  return [...seen.values()];
}

function render() {
  const c0 = cur(), v0 = view(c0), liveBoard = win === 'battle', played = v0.taps.length > 0;
  const nb = (attr, icon, label, cls = '') => `<button ${attr} class="${cls}"><i>${icon}</i>${label}</button>`;
  document.getElementById('bar').innerHTML =
    nb('data-tab="hist"', '☰', 'HISTÓRICO', win === 'hist' ? 'active' : '') +
    nb('data-tab="battle"', '⚔', 'CHAVE', 'main' + (liveBoard ? ' active' : '')) +
    nb('data-tab="rank"', '★', 'RANKING', win === 'rank' ? 'active' : '');
  const filled = v0.names.filter(n => n.trim()).length;
  document.getElementById('home').innerHTML = `<h1>VERSUS</h1>
    <button class="cta" data-tab="battle">${played ? 'Voltar à batalha' : 'Batalhar'}</button>
    <small>${played ? `Chave ao vivo · ${c0.size} MCs` : filled ? `Chave em montagem · ${filled} MCs` : 'Monte a chave e comece'}</small>`;
  document.getElementById('win').hidden = !win;
  if (!win) return;

  document.getElementById('wtitle').textContent = win === 'rank' ? 'RANKING'
    : win === 'hist' ? 'HISTÓRICO' : played ? 'CHAVE · AO VIVO' : 'NOVA CHAVE';
  const tools = document.getElementById('tools'), arena = document.getElementById('arena'), sel = document.getElementById('select');
  arena.hidden = !liveBoard; tools.hidden = !liveBoard;
  document.getElementById('page').hidden = liveBoard;
  if (!liveBoard) { sel.hidden = true; renderPage(); return; }

  // ações da janela; undo/redo ficam no botão flutuante da chave
  tools.innerHTML = (played ? '<small>Toque = round · segure = empate</small>'
    : `<button data-act="grow" ${c0.size >= 16 ? 'disabled' : ''}>+ vagas (${c0.size}→${Math.min(c0.size * 2, 16)})</button>`)
    + `<button data-act="new" ${c0.events.length ? '' : 'disabled'}>Encerrar</button>`;
  document.querySelector('[data-act="undo"]').disabled = c0.cursor === 0;
  document.querySelector('[data-act="redo"]').disabled = c0.cursor === c0.events.length;

  // character select só aparece quando há vaga iluminada; com a chave cheia, a batalha ganha a janela inteira
  const tgt = target(c0, pick);
  sel.hidden = !tgt;
  if (tgt) {
    const used = new Set([...v0.names, ...Object.values(v0.overrides)].filter(n => n.trim()).map(key)), list = roster();
    document.getElementById('grid').innerHTML = list.length ? list.map(r => `<button class="mc${used.has(key(r.name)) ? ' used' : ''}" data-mc="${esc(r.name)}">
        <span>${esc(r.name)}</span>${r.pts ? `<small>${r.pts} pts</small>` : ''}</button>`).join('')
      : '<p class="empty">Adicione os MCs da batalha.</p>';
  }

  const sc = document.getElementById('scroll');
  COL = sc.clientWidth;
  ROW = Math.max(MIN_ROW, Math.floor((sc.clientHeight - LIVE_PAD - 20) / c0.size));
  document.getElementById('board').innerHTML = bracket(c0, { col: COL, row: ROW, slotH: 48, pad: LIVE_PAD, live: true, tgt });
  fx = {};
  // a vaga iluminada sempre à vista (a metade de cima é baixa durante a montagem)
  const te = document.querySelector('#board .target');
  if (te) {
    const top = te.offsetTop, bot = top + te.offsetHeight;
    if (top - 64 < sc.scrollTop) sc.scrollTop = top - 64; // 64 = respiro do undo/redo flutuante
    else if (bot + 12 > sc.scrollTop + sc.clientHeight) sc.scrollTop = bot + 12 - sc.clientHeight;
    if (te.offsetLeft < sc.scrollLeft || te.offsetLeft >= sc.scrollLeft + COL) sc.scrollLeft = Math.floor(te.offsetLeft / COL) * COL;
  }
}

function renderPage() {
  const page = document.getElementById('page');
  if (win === 'hist') {
    // card expande no lugar com a chave (só leitura); entradas antigas só têm o campeão e não expandem
    page.innerHTML = db.history.length ? db.history.map((x, i) => {
      const full = !!(x.events || x.names), open = full && openHist.has(i);
      return `<div class="hcard${open ? ' open' : ''}">
        <${full ? `button data-view="${i}" aria-expanded="${open}"` : 'div'} class="card">
          <small>${fmtDate(x.createdAt)} · ${x.size} MCs</small>
          <b>${x.champion ? '👑 ' + esc(x.champion) : 'sem campeão'}</b>${full ? `<i>${open ? '▴' : '▾'}</i>` : ''}
        </${full ? 'button' : 'div'}>
        ${open ? `<div class="mini">${bracket(x, { col: 170, row: 40, slotH: 30 })}</div>` : ''}</div>`;
    }).join('') : '<p class="empty">Nenhuma batalha encerrada ainda.</p>';
    return;
  }
  const rows = rank(db.history);
  page.innerHTML = rows.length ? `<table><thead><tr><th>#</th><th>MC</th><th>PTS</th><th>V</th><th>2x0</th><th>🏆</th></tr></thead><tbody>${
    rows.map((r, i) => `<tr class="${i < 3 ? 'top' : ''}"><td>${i + 1}</td><td>${esc(r.name)}</td><td>${r.points}</td><td>${r.wins}</td><td>${r.w20}</td><td>${r.titles}</td></tr>`).join('')
  }</tbody></table><p class="legend">Vitória 3 · 2x0 +1 · Título 5</p>`
    : '<p class="empty">Sem ranking ainda — encerre batalhas para acumular pontos.</p>';
}

// ---------- ações ----------
function commit() { save(); render(); }
// Feedback de cada evento: MC pousa na vaga, bolinha pulsa, vencedor sobe; empate pisca o confronto.
function fxOf(ev, s, forward = true) {
  if (ev.t === 'place') return { land: [ev.slot] };
  if (ev.t === 'draw' || !forward) return { flash: ev.match };
  const [c, m] = ev.match.split('-').map(Number), won = derive(view(s)).cols[c][+ev.winner.split('-')[1]].state === 'win';
  return { bump: ev.winner, land: won ? [`${c + 1}-${m}`] : [] };
}
function act(ev) { const s = cur(); push(s, ev); fx = fxOf(ev, s); if (ev.t === 'place') pick = null; commit(); }
function place(name) { const slot = target(cur(), pick); if (slot && name.trim()) act({ t: 'place', slot, name: name.trim() }); }
function tap(match, winner) { act(winner ? { t: 'round', match, winner } : { t: 'draw', match }); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act], [data-tab], [data-view], [data-close], [data-pick], [data-mc]');
  if (!b) return;
  const { act: a, tab: t, view: v, pick: p, mc } = b.dataset, s = cur();
  if (p) { pick = pick === p ? null : p; render(); return; } // tocar de novo na vaga escolhida solta o destaque
  if (mc !== undefined) { place(mc); return; }
  // mesmo botão de novo = fecha a janela e volta para a Home
  if (t) { win = win === t && !b.matches('.cta') ? null : t; pick = null; }
  if (b.dataset.close !== undefined) { win = null; pick = null; }
  if (v !== undefined) { const i = Number(v); openHist.has(i) ? openHist.delete(i) : openHist.add(i); render(); return; }
  if (a === 'undo' && s.cursor > 0) { undo(s); fx = fxOf(s.events[s.cursor], s, false); }
  if (a === 'redo' && s.cursor < s.events.length) { redo(s); fx = fxOf(s.events[s.cursor - 1], s); }
  if (a === 'grow' && s.size < 16 && !view(s).taps.length) s.size *= 2;
  if (a === 'new') {
    if (!confirm('Encerrar esta batalha? Ela vai para o Histórico e conta no Ranking.')) return;
    const vs = view(s), champ = derive(vs).champion, events = s.events.slice(0, s.cursor);
    // guarda a chave inteira (eventos até o cursor) para poder rever o resultado depois
    if (champ || vs.taps.length) { db.history.unshift({ ...s, events, cursor: events.length, champion: champ }); openHist.clear(); } // índices mudam
    db.current = fresh(); pick = null;
  }
  commit();
});

document.getElementById('add').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('addName');
  place(input.value); input.value = '';
});
document.getElementById('addName').addEventListener('blur', () => setTimeout(render, 0)); // teclado fechou: remede a tela

// Toque = round para o MC (nome ou lateral do colchete); segurar HOLD_MS = empate.
const board = document.getElementById('board');
let hold = null;
board.addEventListener('pointerdown', e => {
  const el = e.target.closest('button.slot[data-match]:not(:disabled), .area');
  if (!el) return;
  const match = el.dataset.match, parts = board.querySelectorAll(`[data-match="${match}"]`);
  parts.forEach(p => p.classList.add('holding'));
  hold = { el, match, parts, timer: setTimeout(() => { hold = null; tap(match, null); }, HOLD_MS) };
});
function endHold(e, fire) {
  if (!hold) return;
  clearTimeout(hold.timer);
  hold.parts.forEach(p => p.classList.remove('holding'));
  const h = hold; hold = null;
  if (fire && h.el.contains(e.target)) tap(h.match, h.el.dataset.slot);
}
board.addEventListener('pointerup', e => endHold(e, true));
board.addEventListener('pointercancel', e => endHold(e, false));
board.addEventListener('pointerleave', e => endHold(e, false));
board.addEventListener('contextmenu', e => e.preventDefault());

// Não re-renderiza com campo focado: abrir o teclado no celular redimensiona a tela.
addEventListener('resize', () => { if (!document.activeElement?.matches('input')) render(); });
render(); render(); // 2º passe mede a altura já com a barra de botões preenchida
</script>
